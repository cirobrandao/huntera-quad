<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Huntera Quad</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grid" id="grid">
    <div class="cell" data-account="0">
      <div class="label">
        <span>Conta 1</span>
        <div class="cell-actions">
          <button type="button" data-account="0" data-action="reload" title="Recarregar">↻</button>
          <button type="button" data-account="0" data-action="zoom-out" title="Diminuir zoom">−</button>
          <button type="button" data-account="0" data-action="zoom-in" title="Aumentar zoom">+</button>
          <span class="zoom-label" data-zoom-for="0">100%</span>
          <button type="button" data-account="0" data-action="home" title="Home">⌂</button>
          <button type="button" data-account="0" data-action="clear-account" class="danger" title="Limpar cookies desta conta">Limpar</button>
        </div>
      </div>
    </div>
    <div class="cell" data-account="1">
      <div class="label">
        <span>Conta 2</span>
        <div class="cell-actions">
          <button type="button" data-account="1" data-action="reload" title="Recarregar">↻</button>
          <button type="button" data-account="1" data-action="zoom-out" title="Diminuir zoom">−</button>
          <button type="button" data-account="1" data-action="zoom-in" title="Aumentar zoom">+</button>
          <span class="zoom-label" data-zoom-for="1">100%</span>
          <button type="button" data-account="1" data-action="home" title="Home">⌂</button>
          <button type="button" data-account="1" data-action="clear-account" class="danger" title="Limpar cookies desta conta">Limpar</button>
        </div>
      </div>
    </div>
    <div class="cell" data-account="2">
      <div class="label">
        <span>Conta 3</span>
        <div class="cell-actions">
          <button type="button" data-account="2" data-action="reload" title="Recarregar">↻</button>
          <button type="button" data-account="2" data-action="zoom-out" title="Diminuir zoom">−</button>
          <button type="button" data-account="2" data-action="zoom-in" title="Aumentar zoom">+</button>
          <span class="zoom-label" data-zoom-for="2">100%</span>
          <button type="button" data-account="2" data-action="home" title="Home">⌂</button>
          <button type="button" data-account="2" data-action="clear-account" class="danger" title="Limpar cookies desta conta">Limpar</button>
        </div>
      </div>
    </div>
    <div class="cell" data-account="3">
      <div class="label">
        <span>Conta 4</span>
        <div class="cell-actions">
          <button type="button" data-account="3" data-action="reload" title="Recarregar">↻</button>
          <button type="button" data-account="3" data-action="zoom-out" title="Diminuir zoom">−</button>
          <button type="button" data-account="3" data-action="zoom-in" title="Aumentar zoom">+</button>
          <span class="zoom-label" data-zoom-for="3">100%</span>
          <button type="button" data-account="3" data-action="home" title="Home">⌂</button>
          <button type="button" data-account="3" data-action="clear-account" class="danger" title="Limpar cookies desta conta">Limpar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
